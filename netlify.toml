[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "20"
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"

# La URL y la clave publishable de Supabase son públicas por diseño.
# Mantener el escaneo activo para cualquier otra credencial.
[secrets_scanning]
omit_keys = ["SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY"]
